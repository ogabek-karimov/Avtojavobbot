name = "avtojavobbot"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "BOT_KV"
id = "2d5a17bfa63b45beb593c9079736eadb"

[ai]
binding = "AI"

[vars]
# ADMIN_IDS va OWNER_ID endi bu yerda emas - ular maxfiy (wrangler secret put orqali
# qo'yiladi), chunki bu fayl ochiq (public) GitHub repositoriyasida saqlanadi.
# "workers-ai" - bepul, Cloudflare'ning o'z modeli (Anthropic kredit kerak emas).
# "anthropic" ga o'zgartirsangiz - Claude ishlatiladi (ANTHROPIC_API_KEY'da kredit bo'lishi kerak).
AI_PROVIDER = "workers-ai"
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
CLAUDE_MODEL = "claude-haiku-4-5"
CLAUDE_MAX_TOKENS = "1024"
CLAUDE_EFFORT = "low"
HISTORY_LIMIT = "20"
APP_BASE_URL = "https://avtojavobbot.bek8896ok.workers.dev"
DEFAULT_SYSTEM_PROMPT = "Siz foydalanuvchi nomidan Telegram orqali avtomatik javob beruvchi yordamchisiz. Qisqa, aniq va samimiy javob bering. Agar savolga ishonchli javob bera olmasangiz, buni ochiq ayting va foydalanuvchi tez orada shaxsan javob berishini bildiring."

# Maxfiy qiymatlar (wrangler secret put orqali qo'yiladi, bu faylga yozilmaydi):
#   TELEGRAM_BOT_TOKEN
#   ANTHROPIC_API_KEY
#   TELEGRAM_WEBHOOK_SECRET
#   ADMIN_IDS
#   OWNER_ID
